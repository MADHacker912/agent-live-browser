<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Workspace | Virtual Browser (7654)</title>
  <style>
    :root {
      --bg-canvas: #09090b;
      --bg-chrome: #121214;
      --bg-surface: #18181c;
      --bg-surface-hover: #222227;
      --border-subtle: #27272c;
      --border-hover: #3e3e46;
      --border-cream: #d6cfc2;
      
      --cream-100: #fbf9f5;
      --cream-200: #f4efe6;
      --cream-300: #e8e1d3;
      --cream-400: #d4cbb8;
      --sand-500: #9e9686;
      --sand-600: #706a5e;
      --charcoal-900: #101012;
      --charcoal-800: #1a1a1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-canvas);
      color: var(--cream-200);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Topmost Tab Bar */
    .tab-bar-container {
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 12px 6px 12px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar-container::-webkit-scrollbar { display: none; }

    .tabs-list {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--charcoal-800);
      color: var(--sand-500);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      max-width: 190px;
      min-width: 110px;
      height: 30px;
      transition: background 0.15s, color 0.15s;
    }
    .tab-item:hover {
      background: var(--bg-surface-hover);
      color: var(--cream-200);
    }
    .tab-item.active {
      background: var(--cream-200);
      color: var(--charcoal-900);
      font-weight: 600;
      border-color: var(--cream-200);
    }
    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .tab-close {
      opacity: 0.6;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, background 0.15s;
    }
    .tab-close:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.15);
    }
    .tab-item:not(.active) .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .tab-add-after-btn {
      background: var(--charcoal-800);
      color: var(--sand-500);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      width: 26px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 0;
      margin: 0;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .tab-add-after-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--cream-100);
      border-color: var(--cream-400);
    }

    /* Secondary Nav Bar */
    .nav-toolbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: var(--charcoal-900);
      color: var(--cream-300);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      color: var(--cream-100);
    }
    .icon-btn:active { transform: scale(0.96); }

    .url-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--charcoal-900);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .url-container:focus-within {
      border-color: var(--cream-400);
      box-shadow: 0 0 0 2px rgba(214, 207, 194, 0.15);
    }
    .url-badge {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sand-500);
      margin-right: 10px;
      font-weight: 600;
    }
    #url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--cream-100);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 6px 0;
    }

    .btn-go {
      background: var(--cream-200);
      color: var(--charcoal-900);
      border: 1px solid var(--cream-300);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-go:hover {
      background: var(--cream-100);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(234, 228, 216, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--cream-300);
      letter-spacing: 0.03em;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cream-300);
      opacity: 0.8;
    }
    .connection-status.live .status-dot {
      animation: warmPulse 2s infinite ease-in-out;
    }
    @keyframes warmPulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .connection-status.offline {
      border-color: #5c3838;
      color: #d19a9a;
    }
    .connection-status.offline .status-dot {
      background: #c95d5d;
      animation: none;
    }

    /* Quick Shortcuts Bar */
    .shortcuts-bar {
      background: var(--bg-chrome);
      border-bottom: 1px solid var(--border-subtle);
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }
    .shortcuts-label {
      color: var(--sand-600);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .shortcut-pill {
      background: var(--bg-surface);
      color: var(--cream-300);
      border: 1px solid var(--border-subtle);
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .shortcut-pill:hover {
      background: var(--bg-surface-hover);
      color: var(--cream-100);
      border-color: var(--border-hover);
    }

    /* Notification Banner */
    #user-prompt-banner {
      display: none;
      background: #241c14;
      border-bottom: 1px solid #4a3828;
      color: var(--cream-100);
      padding: 10px 18px;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      z-index: 40;
    }
    #user-prompt-banner.active { display: flex; }
    .banner-left { display: flex; align-items: center; gap: 10px; }
    .banner-dot {
      width: 8px;
      height: 8px;
      background: #eab308;
      border-radius: 50%;
    }
    .banner-btn {
      background: var(--cream-200);
      color: var(--charcoal-900);
      border: 1px solid var(--cream-300);
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .banner-btn:hover { background: var(--cream-100); }

    /* Viewport / Screen Area */
    #viewport-container {
      flex: 1;
      position: relative;
      background: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: default;
    }
    #screen-canvas {
      display: block;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      outline: none;
      background: #ffffff;
      border-radius: 2px;
    }

    /* Claymorphism Agent Cursor */
    .agent-cursor {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 7px;
      transform: translate(-4px, -4px);
      opacity: 0;
      transition: opacity 0.3s ease, left 0.18s cubic-bezier(0.2, 0.8, 0.25, 1), top 0.18s cubic-bezier(0.2, 0.8, 0.25, 1);
    }
    .agent-cursor.visible {
      opacity: 1;
    }

    .clay-pointer {
      width: 22px;
      height: 22px;
      background: #f4efe6; /* cream clay */
      border-radius: 50% 50% 50% 3px;
      transform: rotate(-45deg);
      box-shadow: 
        2px 5px 12px rgba(0, 0, 0, 0.45),
        inset 2px 2px 4px rgba(255, 255, 255, 0.95),
        inset -2px -2px 4px rgba(120, 110, 95, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .clay-badge {
      background: #f4efe6;
      color: #1a1917;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 10px;
      box-shadow: 
        2px 3px 8px rgba(0, 0, 0, 0.3),
        inset 1.5px 1.5px 3px rgba(255, 255, 255, 0.9),
        inset -1.5px -1.5px 3px rgba(120, 110, 95, 0.3);
      white-space: nowrap;
      user-select: none;
    }

    .agent-cursor.clicking .clay-pointer {
      transform: rotate(-45deg) scale(0.75);
      box-shadow: 
        1px 2px 4px rgba(0, 0, 0, 0.35),
        inset 3px 3px 5px rgba(100, 90, 75, 0.3),
        inset -1px -1px 2px rgba(255, 255, 255, 0.6);
    }

    .clay-ripple {
      position: absolute;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      margin-top: -22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 239, 230, 0.55) 0%, rgba(244, 239, 230, 0) 70%);
      box-shadow: 0 0 14px rgba(244, 239, 230, 0.35);
      pointer-events: none;
      animation: clayRippleAnim 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 55;
    }

    @keyframes clayRippleAnim {
      0% { transform: scale(0.2); opacity: 0.95; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    /* Bottom Status Footer */
    footer {
      background: var(--bg-chrome);
      border-top: 1px solid var(--border-subtle);
      padding: 6px 14px;
      font-size: 11px;
      color: var(--sand-500);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-left { display: flex; gap: 16px; align-items: center; }
    .footer-right { display: flex; gap: 16px; align-items: center; }
    .profile-pill {
      font-family: ui-monospace, monospace;
      color: var(--cream-300);
    }
    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-wrap input { accent-color: var(--cream-300); cursor: pointer; }
    #agent-indicator {
      font-weight: 500;
      color: var(--cream-200);
    }
  </style>
</head>
<body>

  <!-- Tab Bar (Multi-tasking & switching) -->
  <div class="tab-bar-container">
    <div class="tabs-list" id="tabs-list">
      <!-- Tabs injected dynamically -->
    </div>
  </div>

  <!-- Secondary Navigation & URL Bar -->
  <div class="nav-toolbar">
    <button class="icon-btn" id="btn-back" title="Back">←</button>
    <button class="icon-btn" id="btn-forward" title="Forward">→</button>
    <button class="icon-btn" id="btn-reload" title="Reload">↻</button>

    <div class="url-container">
      <span class="url-badge">WEB</span>
      <input type="text" id="url-input" placeholder="Enter target URL or search query and press Enter" spellcheck="false" autocomplete="off" />
    </div>

    <button class="btn-go" id="btn-go">Navigate ↵</button>

    <div class="connection-status live" id="ws-status">
      <span class="status-dot"></span>
      <span id="ws-status-text">Studio Live</span>
    </div>
  </div>

  <!-- Quick Shortcuts Bar (Opens in new tab) -->
  <div class="shortcuts-bar">
    <span class="shortcuts-label">Fast Access:</span>
    <button class="shortcut-pill" onclick="openInNewTab('https://web.whatsapp.com')">+ WhatsApp Web</button>
    <button class="shortcut-pill" onclick="openInNewTab('https://accounts.google.com')">+ Google / Gmail</button>
    <button class="shortcut-pill" onclick="openInNewTab('https://www.linkedin.com/login')">+ LinkedIn</button>
    <button class="shortcut-pill" onclick="openInNewTab('https://github.com/login')">+ GitHub</button>
    <button class="shortcut-pill" onclick="openInNewTab('https://x.com/login')">+ X / Twitter</button>
  </div>

  <!-- Notification Banner for Logins & 2FA -->
  <div id="user-prompt-banner">
    <div class="banner-left">
      <span class="banner-dot"></span>
      <span id="banner-message">Authentication or user verification required.</span>
    </div>
    <button class="banner-btn" id="btn-login-done">Done Logging In / Continue Agent</button>
  </div>

  <!-- Main Screencast Viewport -->
  <div id="viewport-container">
    <canvas id="screen-canvas" tabindex="0"></canvas>

    <!-- Claymorphic Agent Cursor Overlay -->
    <div id="agent-cursor" class="agent-cursor">
      <div class="clay-pointer"></div>
      <div class="clay-badge" id="agent-cursor-label">Agent</div>
    </div>
  </div>

  <!-- Footer Information -->
  <footer>
    <div class="footer-left">
      <span>Agent Virtual Display (7654)</span>
      <span>Profile: <span class="profile-pill">~/.agent-live-browser/profile</span></span>
      <span id="resolution-info">1280 × 800</span>
    </div>
    <div class="footer-right">
      <label class="toggle-wrap">
        <input type="checkbox" id="interactive-mode" checked>
        <span>Interactive Control (Clicks & Keys)</span>
      </label>
      <span id="agent-indicator">Agent: Idle</span>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('screen-canvas');
    const ctx = canvas.getContext('2d');
    const urlInput = document.getElementById('url-input');
    const tabsList = document.getElementById('tabs-list');
    const wsStatus = document.getElementById('ws-status');
    const wsStatusText = document.getElementById('ws-status-text');
    const interactiveCheckbox = document.getElementById('interactive-mode');
    const agentIndicator = document.getElementById('agent-indicator');
    const banner = document.getElementById('user-prompt-banner');
    const bannerMsg = document.getElementById('banner-message');

    let browserWidth = 1280;
    let browserHeight = 800;
    let scale = 1;
    let ws = null;
    let lastUrl = '';
    let currentTabs = [];
    let activeIndex = 0;

    canvas.width = browserWidth;
    canvas.height = browserHeight;

    function resizeCanvas() {
      const container = document.getElementById('viewport-container');
      const cw = container.clientWidth - 24;
      const ch = container.clientHeight - 24;
      scale = Math.min(cw / browserWidth, ch / browserHeight, 1);
      canvas.style.width = Math.round(browserWidth * scale) + 'px';
      canvas.style.height = Math.round(browserHeight * scale) + 'px';
      document.getElementById('resolution-info').innerText =
        `${browserWidth} × ${browserHeight} (${Math.round(scale * 100)}%)`;
    }
    window.addEventListener('resize', resizeCanvas);

    // Render Tab Bar with individual + button after each tab
    function renderTabs(tabs, currentActive) {
      currentTabs = tabs || [];
      activeIndex = currentActive;
      tabsList.innerHTML = '';

      currentTabs.forEach((tab) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab-item' + (tab.active ? ' active' : '');
        tabEl.onclick = (e) => {
          if (!e.target.classList.contains('tab-close')) {
            switchTab(tab.index);
          }
        };

        const titleSpan = document.createElement('span');
        titleSpan.className = 'tab-title';
        titleSpan.innerText = tab.title || 'Tab ' + (tab.index + 1);

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '✕';
        closeBtn.title = 'Close tab';
        closeBtn.onclick = (e) => {
          e.stopPropagation();
          closeTab(tab.index);
        };

        tabEl.appendChild(titleSpan);
        tabEl.appendChild(closeBtn);
        tabsList.appendChild(tabEl);
      });

      // Single + button attached immediately after the last tab
      const addAfterBtn = document.createElement('button');
      addAfterBtn.className = 'tab-add-after-btn';
      addAfterBtn.innerHTML = '+';
      addAfterBtn.title = 'Open new tab';
      addAfterBtn.onclick = (e) => {
        e.stopPropagation();
        newTab('https://www.google.com');
      };
      tabsList.appendChild(addAfterBtn);
    }

    async function openInNewTab(url) {
      try {
        const resp = await fetch('/api/tabs/new', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await resp.json();
        renderTabs(data.tabs, data.index);
      } catch (err) {
        console.error('Failed to open shortcut in new tab:', err);
      }
    }

    async function switchTab(index) {
      try {
        const resp = await fetch('/api/tabs/switch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ index })
        });
        const data = await resp.json();
        renderTabs(data.tabs, data.activeIndex);
      } catch (err) {
        console.error('Failed to switch tab:', err);
      }
    }

    async function closeTab(index) {
      try {
        const resp = await fetch('/api/tabs/close', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ index })
        });
        const data = await resp.json();
        renderTabs(data.tabs, data.activeIndex);
      } catch (err) {
        console.error('Failed to close tab:', err);
      }
    }

    async function newTab() {
      try {
        const resp = await fetch('/api/tabs/new', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: 'https://www.google.com' })
        });
        const data = await resp.json();
        renderTabs(data.tabs, data.index);
      } catch (err) {
        console.error('Failed to create new tab:', err);
      }
    }

    const addBtn = document.getElementById('btn-add-tab');
    if (addBtn) addBtn.addEventListener('click', newTab);

    // WebSocket Connection
    function connectWS() {
      const loc = window.location;
      const wsUri = (loc.protocol === 'https:' ? 'wss://' : 'ws://') + loc.host + '/ws';
      ws = new WebSocket(wsUri);

      ws.onopen = () => {
        wsStatus.classList.remove('offline');
        wsStatus.classList.add('live');
        wsStatusText.innerText = 'Studio Live';
      };

      ws.onclose = () => {
        wsStatus.classList.remove('live');
        wsStatus.classList.add('offline');
        wsStatusText.innerText = 'Reconnecting...';
        setTimeout(connectWS, 1500);
      };

      ws.onerror = (err) => {
        console.error('WS Error:', err);
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'frame') {
            const img = new Image();
            img.onload = () => {
              if (browserWidth !== img.naturalWidth || browserHeight !== img.naturalHeight) {
                browserWidth = img.naturalWidth;
                browserHeight = img.naturalHeight;
                canvas.width = browserWidth;
                canvas.height = browserHeight;
                resizeCanvas();
              }
              ctx.drawImage(img, 0, 0);
            };
            img.src = 'data:image/jpeg;base64,' + msg.data;
          } else if (msg.type === 'agent_cursor') {
            updateAgentCursor(msg.x, msg.y, msg.action);
          } else if (msg.type === 'status') {
            if (msg.url && msg.url !== lastUrl) {
              lastUrl = msg.url;
              if (document.activeElement !== urlInput) {
                urlInput.value = msg.url;
              }
            }
            if (msg.tabs) {
              renderTabs(msg.tabs, msg.activeIndex);
            }
            if (msg.agentStatus) {
              agentIndicator.innerText = 'Agent: ' + msg.agentStatus;
            }
            if (msg.userPrompt) {
              bannerMsg.innerText = msg.userPrompt;
              banner.classList.add('active');
            } else {
              banner.classList.remove('active');
            }
          }
        } catch (e) {
          console.error('WS message error:', e);
        }
      };
    }
    connectWS();
    resizeCanvas();

    const agentCursor = document.getElementById('agent-cursor');
    const agentCursorLabel = document.getElementById('agent-cursor-label');
    let cursorHideTimeout = null;

    function updateAgentCursor(x, y, action) {
      if (!agentCursor) return;
      const rect = canvas.getBoundingClientRect();
      const containerRect = document.getElementById('viewport-container').getBoundingClientRect();
      
      const canvasLeft = rect.left - containerRect.left;
      const canvasTop = rect.top - containerRect.top;
      
      const screenX = canvasLeft + (x * scale);
      const screenY = canvasTop + (y * scale);

      agentCursor.style.left = screenX + 'px';
      agentCursor.style.top = screenY + 'px';
      agentCursor.classList.add('visible');

      clearTimeout(cursorHideTimeout);
      cursorHideTimeout = setTimeout(() => {
        agentCursor.classList.remove('visible');
      }, 4000);

      if (action === 'click') {
        agentCursor.classList.add('clicking');
        agentCursorLabel.innerText = 'Clicking...';

        const ripple = document.createElement('div');
        ripple.className = 'clay-ripple';
        ripple.style.left = screenX + 'px';
        ripple.style.top = screenY + 'px';
        document.getElementById('viewport-container').appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);

        setTimeout(() => {
          agentCursor.classList.remove('clicking');
          agentCursorLabel.innerText = 'Agent';
        }, 250);
      } else if (action === 'type') {
        agentCursorLabel.innerText = 'Typing...';
      } else {
        agentCursorLabel.innerText = 'Agent';
      }
    }

    function getBrowserCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(browserWidth, Math.round((e.clientX - rect.left) / scale)));
      const y = Math.max(0, Math.min(browserHeight, Math.round((e.clientY - rect.top) / scale)));
      return { x, y };
    }

    // Canvas Mouse Events
    canvas.addEventListener('mousedown', (e) => {
      if (!interactiveCheckbox.checked || !ws || ws.readyState !== WebSocket.OPEN) return;
      canvas.focus();
      const { x, y } = getBrowserCoords(e);
      const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
      ws.send(JSON.stringify({
        type: 'mouse',
        subType: 'mousePressed',
        x, y, button, clickCount: e.detail || 1
      }));
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!interactiveCheckbox.checked || !ws || ws.readyState !== WebSocket.OPEN) return;
      const { x, y } = getBrowserCoords(e);
      const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
      ws.send(JSON.stringify({
        type: 'mouse',
        subType: 'mouseReleased',
        x, y, button, clickCount: e.detail || 1
      }));
    });

    let moveThrottle = 0;
    canvas.addEventListener('mousemove', (e) => {
      if (!interactiveCheckbox.checked || !ws || ws.readyState !== WebSocket.OPEN) return;
      const now = Date.now();
      if (now - moveThrottle < 30) return;
      moveThrottle = now;
      const { x, y } = getBrowserCoords(e);
      ws.send(JSON.stringify({
        type: 'mouse',
        subType: 'mouseMoved',
        x, y
      }));
    });

    canvas.addEventListener('wheel', (e) => {
      if (!interactiveCheckbox.checked || !ws || ws.readyState !== WebSocket.OPEN) return;
      e.preventDefault();
      const { x, y } = getBrowserCoords(e);
      ws.send(JSON.stringify({
        type: 'wheel',
        x, y,
        deltaX: e.deltaX,
        deltaY: e.deltaY
      }));
    }, { passive: false });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Canvas Keyboard Events
    canvas.addEventListener('keydown', (e) => {
      if (!interactiveCheckbox.checked || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (['Tab', 'ArrowUp', 'ArrowDown', 'Space', 'Backspace'].includes(e.key)) {
        e.preventDefault();
      }
      ws.send(JSON.stringify({
        type: 'key',
        subType: 'keyDown',
        key: e.key,
        code: e.code,
        text: e.key.length === 1 ? e.key : ''
      }));
    });

    canvas.addEventListener('keyup', (e) => {
      if (!interactiveCheckbox.checked || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'key',
        subType: 'keyUp',
        key: e.key,
        code: e.code
      }));
    });

    // Navigation Controls
    function navigate(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }
      }
      urlInput.value = url;
      fetch('/api/navigate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        navigate(urlInput.value.trim());
        canvas.focus();
      }
    });

    document.getElementById('btn-go').addEventListener('click', () => {
      navigate(urlInput.value.trim());
      canvas.focus();
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      fetch('/api/back', { method: 'POST' });
    });
    document.getElementById('btn-forward').addEventListener('click', () => {
      fetch('/api/forward', { method: 'POST' });
    });
    document.getElementById('btn-reload').addEventListener('click', () => {
      fetch('/api/reload', { method: 'POST' });
    });

    document.getElementById('btn-login-done').addEventListener('click', () => {
      fetch('/api/user_done', { method: 'POST' });
      banner.classList.remove('active');
    });
  </script>
</body>
</html>
